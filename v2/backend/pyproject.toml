[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolwithagent-v2"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "alembic>=1.13", "sqlalchemy==2.0.49", "openpyxl>=3.1", "agno==2.5.17", "openai==2.32.0", "python-dotenv>=1.0", "numpy>=1.24", "httpx>=0.24", "pydantic>=2.12,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
