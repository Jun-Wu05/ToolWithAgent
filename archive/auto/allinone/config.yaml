"# 配置文件模板\n\nphase1:\n  input_dir: \"data\"                          # 原始 Base64 文件目录\n  output_dir: \"data/output/phase1\"           # Phase1 输出目录\n\nphase2:\n  output_dir: \"data/output/phase2\"           # Phase2 输出目录\n  auto_call: false                           # 是否自动调用 LLM API\n  prompt_templates:\n    field_strong: \"../phase2/提示词-强匹配.md\"\n    field_weak: \"../phase2/标准字段.md\"\n    threat: \"../phase2/威胁类型.md\"\n\nphase3:\n  log_dir: \"data\"                            # 原始日志目录（与 phase1 输入相同）\n  output_dir: \"data/output/phase3\"           # Phase3 输出目录\n  auto_extract_fields: true                  # 是否自动从 mapping 文件提取字段\n\n# LLM API 配置（可选，用于 Phase2 自动调用）\nllm:\n  provider: \"openai\"                         # 或 \"anthropic\"\n  api_key: \"your-api-key-here\"\n  model: \"gpt-4\"\n  max_tokens: 4096\n  temperature: 0.0\n\n# 日志配置\nlogging:\n  level: \"INFO\"\n  file: \"data/output/pipeline.log\"\n" 
# 配置文件模板

phase1:
  input_dir: "data"                          # 原始 Base64 文件目录
  output_dir: "data/output/phase1"           # Phase1 输出目录

phase2:
  output_dir: "data/output/phase2"           # Phase2 输出目录
  auto_call: false                           # 是否自动调用 LLM API
  prompt_templates:
    field_strong: "../phase2/提示词-强匹配.md"
    field_weak: "../phase2/标准字段.md"
    threat: "../phase2/威胁类型.md"

phase3:
  log_dir: "data"                            # 原始日志目录（与 phase1 输入相同）
  output_dir: "data/output/phase3"           # Phase3 输出目录
  auto_extract_fields: true                  # 是否自动从 mapping 文件提取字段

# LLM API 配置（可选，用于 Phase2 自动调用）
llm:
  provider: "openai"                         # 或 "anthropic"
  api_key: "your-api-key-here"
  model: "gpt-4"
  max_tokens: 4096
  temperature: 0.0

# 日志配置
logging:
  level: "INFO"
  file: "data/output/pipeline.log"