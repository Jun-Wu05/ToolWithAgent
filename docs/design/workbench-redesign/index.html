kground:var(--line);position:relative;border-radius:2px}.band .track i{position:absolute;top:0;height:10px;min-width:4px;background:var(--action);border-radius:2px}.trace-body{display:grid;grid-template-columns:minmax(0,1fr);flex:1;min-height:0}.trace-body.inspect{grid-template-columns:minmax(0,1fr) 365px}.ledger{overflow:auto;min-height:0}.group{background:var(--base);border-bottom:1px solid var(--line);padding:7px 15px;color:var(--muted);font-size:12px}.group strong{color:var(--ink);font-weight:550;margin-left:12px}.event{display:grid;grid-template-columns:73px 14px minmax(0,1fr) 74px;gap:8px;align-items:baseline;min-height:37px;padding:7px 16px;border-bottom:1px solid var(--line);font-size:14px}.event.selected{background:var(--tint);box-shadow:inset 3px 0 var(--action)}.event time{font:12px var(--mono);color:var(--muted)}.event .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}.event.run .dot{background:var(--action)}.event strong{font-weight:570}.event .desc{color:var(--muted);margin-left:12px;overflow-wrap:anywhere}.event .status{font-size:12px;color:var(--muted);text-align:right}.inspector{border-left:1px solid var(--line);padding:15px 17px;overflow:hidden;font-size:13px}.inspector h3{font-size:16px;margin:2px 0 13px}.inspector small{color:var(--muted)}.inspector .row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:9px;margin:8px 0;overflow-wrap:anywhere}.inspector .row span:first-child{color:var(--muted)}.inspector section{border-top:1px solid var(--line);margin-top:15px;padding-top:13px}.inspector h4{margin:0 0 8px}.inspector p{margin:0 0 8px;overflow-wrap:anywhere}.inspector code,.inspector pre{font:12px/1.5 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}.inspector pre{background:var(--inset);padding:9px;max-height:98px;overflow:hidden}.inspector .call{padding:8px 10px;border:1px solid var(--line);border-radius:5px}.inspector .call strong,.inspector .call small{display:block}.inspector .footer{display:flex;gap:8px;margin- const params=new URLSearchParams(location.search),scene=params.get('scene')||'trace-overview';if(scene==='dark')document.body.classList.add('dark');const root=document.getElementById('root');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shell=(tab,body)=>`<div class="shell"><aside class="sidebar"><div class="logo">ToolWithAgent</div><button class="new">＋ 新建会话</button><div class="nav active">工作台</div><div class="nav">任务记录</div><div class="nav">运行记录</div><h4>最近会话</h4><div class="recent">安全日志字段映射<small>今天 14:14</small></div><div class="recent">日志格式诊断<small>今天 13:56</small></div><div class="identity">当前用户<small>普通用户</small></div></aside><main><div class="top"><div><strong>安全日志字段映射</strong> <span>／ 84 行日志 · 193 个字段</span></div><span>Run a946359d · 脱敏验收数据</span></div><div class="tabs"><span class="${tab==='chat'?'active':''}">对话</span><span class="${tab==='trace'?'active':''}">轨迹</span><em>今日 14:13–14:14</em></div><div class="body">${body}</div></main></div>`;

const chat=(mode)=>{let rows=line('用户','请根据这份安全日志完成标准字段映射，并保留可以人工检查的结果。','user')+line('助手','已接收 84 行日志。先校验输入，再提取字段与生成映射。')+line('进展','<div class="step"><strong>文件校验</strong> <span class="ok">已完成</span> · 84 行可读取</div><div class="step"><strong>字段提取</strong> <span class="ok">已完成</span> · 193 个字段</div><div class="step"><strong>标准字段映射</strong> <span class="'+(mode==='running'?'warn':'ok')+'">'+(mode==='running'?'运行中':'已完成')+'</span> · Run a946359d</div>');if(mode==='running')rows+=line('助手','正在处理第 2/2 批字段。已记录 14 次模型调用；轨迹中可按时间定位每一步。');if(mode==='confirm')rows+=line('助手','检出需要人工确认的映射建议。请检查来源字段与目标字段，再决定是否应用。'+action('确认并继续','暂不确认'));if(mode==='complete')rows+=line('助手','映射已完成。193 个字段中，已匹配 137 个，56 个保持未匹配；未匹配不代表人工审核结论。'+action('查看映射结果','下载产物'));if(mode==='failure')rows+=line('助手','本次执行未完成：缺少必填的数据来源字段。补全后可以重新执行；失败前的事件仍保留在轨迹中。'+action('补全字段','查看失败轨迹'));const right=mode==='confirm'?panel('待确认 · 映射建议',`<p class="meta">来源文件：security-log.csv</p><table class="mapping-table"><tr><th>来源字段</th><th>建议目标</th><th>状态</th></tr><tr><td>src_address</td><td>src_ip</td><td>待确认</td></tr><tr><td>event_time</td><td>timestamp</td><td>待确认</td></tr><tr><td>threat_label</td><td>threat_type</td><td>待确认</td></tr></table><p class="uncollected">确认后继续执行；未确认的建议不会自动写回。</p>`,button('确认并继续')):mode==='complete'?panel('结果与产物',`<h3>标准字段映射</h3><div class="row"><span>状态</span><span class="ok">已发布</span></div><div class="row"><span>规则</span><span>84 行输入 · 193 个字段</span></div><div class="row"><span>已匹配</span><span>137</span></div><div class="row"><span>未匹配</span><span>56 · 保留人工检查</span></div><div class="row"><span>版本</span><code>a946359d / 当前</code></div>`,button('打开字段映射')+button('下载产物','secondary')):'';return shell('chat',`<div class="conversation ${right?'side':''}"><div class="chat"><div class="chat-scroll">${rows}</div>${composer}</div>${right}</div>`)};function button(label,cls='action'){return `<button class="${cls}">${label}</button>`}
const events=window.fixtureEvents;const runs=window.fixtureRuns;const start=Date.parse(runs[0].queued_at);const end=Math.max(...runs.map(r=>Date.parse(r.finished_at||r.started_at||r.queued_at)));const span=end-start;const localTime=s=>new Date(s).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});const band='<div class="band"><div class="times"><span>'+localTime(start)+'</span><span>'+localTime(end)+'</span></div><div class="track">'+runs.map(r=>{const left=(Date.parse(r.queued_at)-start)/span*100;const width=Math.max(.7,(Date.parse(r.finished_at||r.started_at||r.queued_at)-Date.parse(r.queued_at))/span*100);return '<i style="left:'+left+'%;width:'+width+'%;background:'+(r.status==='failed'?'var(--danger)':'var(--action)')+'"></i>'}).join('')+'</div></div>';const eventRow=(e,i,selected)=>`<div class="event ${e[1]} ${selected===i?'selected':''}"><time>${e[0]}</time><span class="dot"></span><div><strong>${e[2]}</strong><span class="desc">${e[3]}</span></div><span class="status">${e[4]}</span></div>`;const inspector=(failure=false)=>`<aside class="inspector"><small>${failure?'失败定位':'事件 8 / Run a946359d'}</small><h3>${failure?'字段校验失败':'模型调用'}</h3><div class="row"><span>状态</span><span class="${failure?'bad':'warn'}">${failure?'失败':'运行中'}</span></div><div class="row"><span>时间</span><code>${failure?'13:56:04':'14:13:30'}</code></div><div class="row"><span>层级</span><span>步骤</span></div><div class="row"><span>步骤</span><code>${failure?'input_validation':'model_call'}</code></div><section><h4>记录摘要</h4><p>${failure?'缺少必填的数据来源字段。当前 Run 的后续步骤未执行。':'第二批字段开始模型处理。原始内容按当前用户权限读取。'}</p></section>${failure?`<section><h4>错误代码</h4><code>data_source_fields_required</code><p class="uncollected">未执行步骤：写回结果 · 原因来自 Run 诊断</p></section><div class="footer">${button('补全后重试')}${button('完整诊断','secondary')}</div>`:`<section><h4>本 Run 调用 · 14 次</h4><div class="call"><strong>field_mapping · 模型调用</strong><small>调用 ID 脱敏 · 耗时 1.6 秒</small root.innerHTML=scene==='chat-running'?chat('running'):scene==='chat-confirm'?chat('confirm'):scene==='chat-complete'?chat('complete'):scene==='chat-failure'?chat('failure'):trace(scene);
